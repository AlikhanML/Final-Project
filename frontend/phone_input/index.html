<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:var(--text,#e9eef8)}form{padding:12px;border:1px solid #8090a344;border-radius:10px}label{display:block;margin-bottom:8px}.field,button{background:var(--surface,#101827);color:inherit;border:1px solid #8795a566;border-radius:8px;min-height:42px}.field{display:flex;align-items:center;gap:.32em;padding:0 12px;font-size:16px;font-variant-numeric:tabular-nums}.field:focus-within{outline:2px solid #47bda4}input{min-width:0;width:100%;padding:8px 0;border:0;outline:none;background:transparent;color:inherit;font:inherit}input::placeholder{color:#8493a4}button{width:100%;margin-top:10px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid #47bda4}
</style></head><body>
<form><label for="phone">Шақыртушының телефон нөмірі</label><div class="field"><span id="prefix">+7</span><input type="tel" inputmode="numeric" autocomplete="tel-national" id="phone" aria-describedby="prefix" placeholder="775 713 0751"></div><button disabled>Қоңырау шалу</button></form>
<script src="mask.js"></script></body></html>
